name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Test
        run: cargo test --release --features http

      - name: Build
        run: cargo build --release --features http

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-extract-linux-x86_64
          path: target/release/ghostlock-extract

  build-macos:
    name: Build macOS Universal
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build macOS universal binary
        run: |
          cargo build --release --features http --target aarch64-apple-darwin
          cargo build --release --features http --target x86_64-apple-darwin
          mkdir -p bin
          lipo -create -output bin/ghostlock-extract-macos-universal \
            target/aarch64-apple-darwin/release/ghostlock-extract \
            target/x86_64-apple-darwin/release/ghostlock-extract

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-extract-macos-universal
          path: bin/ghostlock-extract-macos-universal

  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --features http

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-extract-windows-x86_64
          path: target/release/ghostlock-extract.exe

  build-android:
    name: Build Android arm64
    runs-on: ubuntu-latest
    env:
      ONDK_VERSION: "r30.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Cache ONDK
        id: ondk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ondk
          key: ondk-${{ env.ONDK_VERSION }}-linux

      - name: Download ONDK
        if: steps.ondk-cache.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/topjohnwu/ondk/releases/download/${ONDK_VERSION}/ondk-${ONDK_VERSION}-linux.tar.xz"
          mkdir -p "${{ runner.temp }}/ondk"
          curl -fL "$url" -o "${{ runner.temp }}/ondk.tar.xz"
          tar -C "${{ runner.temp }}/ondk" --strip-components=1 -xf "${{ runner.temp }}/ondk.tar.xz"

      - name: Link ONDK Rust toolchain
        run: rustup toolchain link ondk "${{ runner.temp }}/ondk/toolchains/rust"

      - name: Build Android arm64
        run: |
          export CC_aarch64_linux_android="${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          export AR_aarch64_linux_android="${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          export RUSTC_BOOTSTRAP=1
          export RUSTFLAGS="-C force-unwind-tables=no -C link-arg=-Wl,--icf=all"
          cargo +ondk build --release --target aarch64-linux-android --features http \
            -Z build-std=std,panic_abort -Z build-std-features=optimize_for_size

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-extract-android-arm64
          path: target/aarch64-linux-android/release/ghostlock-extract
